<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 160" width="200" height="160">
  <defs>
    <linearGradient id="cfrBrandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e5cc" />
      <stop offset="50%" stop-color="#7ff5e6" />
      <stop offset="100%" stop-color="#e8933c" />
    </linearGradient>
    <linearGradient id="cfrSilver" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#d4d4de" />
      <stop offset="100%" stop-color="#8e8e9e" />
    </linearGradient>
    <filter id="cfrGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Architectural Roof Peak & Structure -->
  <g filter="url(#cfrGlow)">
    <!-- Outer Peak Frame -->
    <path d="M 100 14 L 178 72 L 166 82 L 100 33 L 34 82 L 22 72 Z" fill="url(#cfrBrandGrad)" />
    <!-- Secondary Craftsmanship Accent Line -->
    <path d="M 100 38 L 152 76 L 144 83 L 100 50 L 56 83 L 48 76 Z" fill="url(#cfrSilver)" opacity="0.85" />
    <!-- Foundation Baseline (Laser-Level Floor Line) -->
    <rect x="26" y="142" width="148" height="4" rx="2" fill="url(#cfrBrandGrad)" />
    <!-- Foundation Stepped Trim -->
    <rect x="50" y="149" width="100" height="2" rx="1" fill="url(#cfrSilver)" opacity="0.6" />
  </g>

  <!-- CFR Center Monogram -->
  <text x="100" y="125" font-family="'Cormorant Garamond', 'Times New Roman', Georgia, serif" font-size="52" font-weight="700" fill="url(#cfrSilver)" text-anchor="middle" letter-spacing="4">SC</text>
  
  <!-- Subtle Cornerstone Dots -->
  <circle cx="100" cy="8" r="3.5" fill="#00e5cc" />
</svg>
